services:
  db:
    image: mysql:8.0
    container_name: iguana-db-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: iguana123
      MYSQL_DATABASE: iguanautp
      MYSQL_USER: iguana
      MYSQL_PASSWORD: iguana123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-piguana123"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: iguana-pma-local
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: iguana123
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  db_data:
