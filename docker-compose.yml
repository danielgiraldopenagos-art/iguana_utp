services:
  db:
    image: postgres:16-alpine
    container_name: iguana-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: iguanautp
      POSTGRES_USER: iguana
      POSTGRES_PASSWORD: iguana123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iguana -d iguanautp"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: iguana-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@iguana.utp
      PGADMIN_DEFAULT_PASSWORD: iguana123
    ports:
      - "8081:80"

volumes:
  db_data:
